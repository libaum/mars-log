name: mars_log
description: "Mars Log — voice journal. Talk, and it writes itself."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.5
  get_it: ^9.0.0
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  record: ^6.0.0
  audioplayers: ^6.1.0
  local_auth: ^2.3.0
  archive: ^3.6.1
  file_picker: ^8.1.2
  share_plus: ^10.1.2
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  url_launcher: ^6.3.0
  whisper_ggml: ^2.3.0
  gemini_nano_android: ^0.1.3
  flutter_foreground_task: ^11.0.1
  workmanager: ^0.10.10
  saf_util: ^3.1.0
  saf_stream: ^4.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # E2E sync to the owner's hub. Path dependency: personal build only, never
  # published — see ../SYNC.md.
  mars_sync:
    path: ../mars_sync

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  path_provider_platform_interface: any
  plugin_platform_interface: any

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-VariableFont_wght.ttf
